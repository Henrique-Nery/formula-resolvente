<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Fórmula Resolvente</title>
</head>
<body>

  <script>
	let repetir;
    do{
    let a, b, c;
	do{
		a=Number(prompt("Valor de a:"));
		if(a===0 || isNaN(a)) {
			alert("O valor de a não pode ser igual a 0 e tem de ser um número real")
		} 
	}while(a===0 || isNaN(a));
   	do{
		b=Number(prompt("Valor de b:"));
		if(isNaN(b)) {
			alert("O valor de b tem de ser um número real")
		} 
	}while(isNaN(b));
    do{
	    c=Number(prompt("Valor de c:"));
		if(isNaN(c)) {
			alert("O valor de c tem de ser um número real")
		} 
	}while(isNaN(c));
    let delta = b * b - 4 * a * c;
    if (delta >= 0) {
      let x1 = ((-b + Math.sqrt(delta)) / (2 * a)).toFixed(2);
      let x2 = ((-b - Math.sqrt(delta)) / (2 * a)).toFixed(2);
      alert("x1 = " + x1 + " e x2 = " + x2);
    } else {
      alert("Não existem raízes reais.");
    }
	
	repetir=confirm("Deseja inserir novos valores?")
	} while (repetir);
	
  </script>

</body>
</html>
